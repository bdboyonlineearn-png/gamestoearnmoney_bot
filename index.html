<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucky Spin Rewards</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#020617;
  color:#fff;
  text-align:center
}
h2{margin:10px}
.card{
  background:#0f172a;
  padding:15px;
  border-radius:16px;
  margin:10px
}
.btn{
  width:90%;
  padding:14px;
  margin:6px;
  border:none;
  border-radius:12px;
  font-size:15px;
  color:#fff;
  background:linear-gradient(45deg,#22c55e,#16a34a)
}
.btn:disabled{
  background:#334155
}
#status{margin:10px;font-size:14px;color:#a5f3fc}

/* Fullscreen ad overlay (interstitial feel) */
#adOverlay{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:9999;
  align-items:center;
  justify-content:center;
  flex-direction:column
}
#adOverlay span{
  margin-top:10px;
  font-size:14px;
  color:#94a3b8
}
</style>

<!-- ✅ OFFICIAL GIGAPUB SCRIPT -->
<script src="https://ad.gigapub.tech/script?id=5619"></script>
</head>

<body>

<h2>🎰 Lucky Spin Rewards</h2>

<div>
💰 Coins: <b id="coins">0</b>
</div>

<div id="status">Ads ready</div>

<div class="card">
  <button id="adBtn" class="btn" onclick="playAd()">🎁 Watch Ad & Earn</button>
</div>

<!-- Fullscreen overlay -->
<div id="adOverlay">
  <h3>Ad is playing…</h3>
  <span>Please wait</span>
</div>

<script>
/* -------------------------
   BASIC STATE
--------------------------*/
let cooldown = 10; // seconds
let timer = null;

/* Load coins */
document.getElementById("coins").innerText =
  localStorage.getItem("coins") || 0;

/* -------------------------
   PLAY AD (SAFE)
--------------------------*/
function playAd(){
  if(document.getElementById("adBtn").disabled) return;

  // UI lock
  document.getElementById("adBtn").disabled = true;
  document.getElementById("status").innerText = "Ad loading…";
  document.getElementById("adOverlay").style.display = "flex";

  // ✅ OFFICIAL GIGAPUB CALL
  window.showGiga()
    .then(() => {
      rewardUser();
      document.getElementById("status").innerText = "Ad completed ✅";
    })
    .catch(err => {
      console.log(err);
      document.getElementById("status").innerText = "Ad failed ❌";
    })
    .finally(() => {
      document.getElementById("adOverlay").style.display = "none";
      startCooldown();
    });
}

/* -------------------------
   REWARD LOGIC (BAN-FREE)
--------------------------*/
function rewardUser(){
  let coins = parseInt(localStorage.getItem("coins") || "0");
  coins += 1; // realistic reward
  localStorage.setItem("coins", coins);
  document.getElementById("coins").innerText = coins;
}

/* -------------------------
   COOLDOWN SYSTEM (10s)
--------------------------*/
function startCooldown(){
  let left = cooldown;
  document.getElementById("status").innerText =
    `Please wait ${left}s before next ad`;

  timer = setInterval(() => {
    left--;
    if(left <= 0){
      clearInterval(timer);
      document.getElementById("adBtn").disabled = false;
      document.getElementById("status").innerText = "Ads ready";
    }else{
      document.getElementById("status").innerText =
        `Please wait ${left}s before next ad`;
    }
  },1000);
}
</script>

</body>
 </html>
