<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Ad Reward System</title>
    
    <script src="https://ad.gigapub.tech/script?id=5619"></script>

    <style>
        :root {
            --primary: #00c853;
            --primary-dark: #009624;
            --secondary: #ff6d00;
            --secondary-dark: #e65100;
            --blue: #4285f4;
            --blue-dark: #3367d6;
            --dark: #121212;
            --darker: #0a0a0a;
            --light: #f5f5f5;
            --gray: #2a2a2a;
            --card-bg: #1f1f1f;
            --gold: #ffd700;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, var(--darker), #1a1a2e);
            color: var(--light);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .header {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            padding: 25px 20px;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .developer {
            display: inline-block;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
            cursor: pointer;
        }
        
        .content {
            padding: 25px;
        }
        
        .user-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 15px 10px;
            width: 45%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        
        .stat-card .value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }
        
        .progress-bar {
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 25px 0;
        }
        
        .btn-3d {
            padding: 16px 20px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            box-shadow: 0 8px 0 var(--primary-dark);
            transition: all 0.2s ease;
        }
        
        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 var(--primary-dark);
        }
        
        .btn-secondary {
            background: linear-gradient(45deg, var(--secondary), #ff9100);
            box-shadow: 0 8px 0 var(--secondary-dark);
        }
        
        .ad-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        
        .ad-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
    <div class="ad-notification" id="ad-notification">Ad completed!</div>
    
    <div class="container">
        <div class="header">
            <h1>Premium Ad Reward System</h1>
            <div class="developer" onclick="window.location.href='https://t.me/TGJOOBBOTOWNER'">Developer by Anonymous 😔</div>
        </div>
        
        <div class="content">
            <div class="user-info">
                <p>Welcome, <span id="user-name">User</span></p>
                <p>User ID: <span id="user-id">#USR-0000</span></p>
            </div>
            
            <div class="stats">
                <div class="stat-card">
                    <h3>Watched Ads</h3>
                    <div class="value" id="watched-ads">0</div>
                </div>
                <div class="stat-card">
                    <h3>Earned Points</h3>
                    <div class="value" id="earned-points">0.00</div>
                </div>
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            
            <div class="ad-container">
                <p style="font-size: 12px; color: #aaa; margin-bottom: 10px;">GIGAPUB INTERSTITIAL AD</p>
                <div class="buttons">
                    <button class="btn-3d" onclick="watchAd()">Watch Ad (+0.50)</button>
                    <button class="btn-3d btn-secondary" id="auto-ad-btn" onclick="startAutoAds()">Auto Show Ads (5s)</button>
                    <button class="btn-3d" onclick="stopAutoAds()">Stop Auto Ads</button>
                </div>
            </div>
            
            <div class="footer" style="text-align: center; color: #777; font-size: 12px;">
                <p>Secured by Firebase • All Rights Reserved</p>
            </div>
        </div>
    </div>

    <script>
        const POINTS_PER_AD = 0.50;
        let watchedAdsCount = 0;
        let earnedPoints = 0;
        let autoAdInterval;

        function initApp() {
            watchedAdsCount = parseInt(localStorage.getItem('watchedAdsCount')) || 0;
            earnedPoints = parseFloat(localStorage.getItem('earnedPoints')) || 0;
            
            if (!localStorage.getItem('userId')) {
                localStorage.setItem('userId', Math.floor(10000 + Math.random() * 90000));
            }
            
            document.getElementById('user-id').textContent = `#USR-${localStorage.getItem('userId')}`;
            updateUI();
        }

        function updateUI() {
            document.getElementById('watched-ads').textContent = watchedAdsCount;
            document.getElementById('earned-points').textContent = earnedPoints.toFixed(2);
            const progress = (watchedAdsCount % 10) * 10;
            document.getElementById('progress-fill').style.width = `${progress}%`;
        }

        function watchAd() {
            showAdNotification("Loading Gigapub Ad...");
            
            if (typeof window.showGiga === 'function') {
                window.showGiga()
                    .then(() => {
                        watchedAdsCount++;
                        earnedPoints += POINTS_PER_AD;
                        localStorage.setItem('watchedAdsCount', watchedAdsCount);
                        localStorage.setItem('earnedPoints', earnedPoints);
                        updateUI();
                        showAdNotification("Ad completed! +0.50 points");
                    })
                    .catch(e => {
                        showAdNotification("Ad failed to load.");
                    });
            } else {
                showAdNotification("Script error.");
            }
        }

        function startAutoAds() {
            // ৫ সেকেন্ড ইন্টারভাল সেট করা হয়েছে
            autoAdInterval = setInterval(watchAd, 5000); 
            document.getElementById('auto-ad-btn').textContent = "Auto Running (5s)...";
            showAdNotification("Auto Ads Started (5s interval)");
        }

        function stopAutoAds() {
            clearInterval(autoAdInterval);
            document.getElementById('auto-ad-btn').textContent = "Auto Show Ads (5s)";
            showAdNotification("Auto Ads Stopped.");
        }

        function showAdNotification(message) {
            const el = document.getElementById('ad-notification');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        window.onload = initApp;
    </script>
</body>
  </html>
