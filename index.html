<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Spin Rewards</title>

<style>
body{margin:0;font-family:system-ui;background:#020617;color:#fff;text-align:center}
.card{max-width:420px;margin:20px auto;background:#0f172a;padding:20px;border-radius:20px}
.btn{width:100%;padding:16px;margin-top:10px;border:none;border-radius:12px;
background:linear-gradient(45deg,#22c55e,#16a34a);color:#fff;font-size:16px}
.btn:disabled{background:#475569}
#wheelBox{position:relative}
#wheel{
 width:200px;height:200px;border-radius:50%;
 background:conic-gradient(#22c55e,#4ade80,#16a34a,#22c55e);
 margin:20px auto;border:6px solid #020617;
 transition:transform 2s ease-out
}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:24px;color:gold}
.spin{transform:rotate(1080deg)}
.popup{
 display:none;position:fixed;bottom:20px;left:10%;width:80%;
 background:#16a34a;padding:12px;border-radius:14px;z-index:99
}
#overlay{
 display:none;position:fixed;inset:0;background:#000;
 z-index:9999;color:#fff;align-items:center;justify-content:center;
 flex-direction:column
}
</style>
</head>

<body>

<div class="card">
<h2>🎰 Lucky Spin Rewards</h2>

<div id="wheelBox">
<div id="wheel"></div>
<div class="pointer">▲</div>
</div>

<div>💰 Coins: <span id="coins">0</span></div>
<div id="value">≈ 0৳ | $0.00</div>
<div id="status">Ads ready</div>

<button id="adBtn" class="btn">🎁 Watch Ad & Spin</button>

<button class="btn"
onclick="window.open('https://link.gigapub.tech/l/5kvfq30ta','_blank')">
🔗 Gigapub Direct Link
</button>
</div>

<div class="card">
<h3>💳 Withdraw</h3>
<select id="method" style="width:100%;padding:10px;border-radius:10px">
<option>bKash</option>
<option>Nagad</option>
<option>USDT</option>
</select>
<input id="wallet" placeholder="Wallet / Number"
style="width:100%;padding:10px;border-radius:10px;margin-top:8px">
<button class="btn" onclick="withdraw()">Request Withdraw</button>
</div>

<div class="card">
<h3>🏆 Top Players</h3>
<ul id="leader" style="list-style:none;padding:0"></ul>
</div>

<div class="card">
👥 Online Users: <span id="online">0</span>
</div>

<div class="popup" id="popup"></div>

<div id="overlay">
<h2>Ad is playing...</h2>
<div id="timer">15</div>
</div>

<!-- ✅ ONLY REQUIRED Gigapub SDK -->
<script src="https://ad.gigapub.tech/script?id=5619"></script>

<script>
let coins=0,locked=false;
const wheel=document.getElementById("wheel");
const btn=document.getElementById("adBtn");
const status=document.getElementById("status");

function spin(){
 wheel.classList.add("spin");
 setTimeout(()=>wheel.classList.remove("spin"),2000);
}

function coinValue(){
 document.getElementById("value").innerText=
 `≈ ${(coins/1000*100).toFixed(0)}৳ | $${(coins/1200).toFixed(2)}`;
}

function overlay(sec,done){
 const o=document.getElementById("overlay");
 const t=document.getElementById("timer");
 o.style.display="flex";
 let s=sec; t.innerText=s;
 const i=setInterval(()=>{
   s--; t.innerText=s;
   if(s<=0){clearInterval(i);o.style.display="none";done();}
 },1000);
}

btn.onclick=()=>{
 if(!window.showGiga){
   alert("Gigapub SDK load হয়নি");
   return;
 }
 if(locked) return;

 locked=true; btn.disabled=true;
 status.innerText="Ads আসছে ⏳";
 spin();

 overlay(15,()=>{
   coins+=10;
   document.getElementById("coins").innerText=coins;
   coinValue();
   status.innerText="Ads শেষ ✅";
   locked=false; btn.disabled=false;
 });

 window.showGiga()
 .then(()=>console.log("Ad completed"))
 .catch(()=>{
   alert("Ad failed");
   locked=false; btn.disabled=false;
 });
};

// fake leaderboard
const names=["Rafi","Hasan","Siam","Arif","Fahim","Nayeem"];
function leader(){
 const ul=document.getElementById("leader"); ul.innerHTML="";
 names.sort(()=>0.5-Math.random()).slice(0,4).forEach(n=>{
   const li=document.createElement("li");
   li.innerText=`${n} – ${Math.floor(Math.random()*5000)+500} coins`;
   ul.appendChild(li);
 });
}
setInterval(leader,4000); leader();

// fake popup
function popup(){
 const p=document.getElementById("popup");
 p.innerText=`🎉 ${names[Math.floor(Math.random()*names.length)]} won ${Math.floor(Math.random()*400)+100} coins`;
 p.style.display="block";
 setTimeout(()=>p.style.display="none",3000);
}
setInterval(popup,12000);

// online users
setInterval(()=>{
 document.getElementById("online").innerText=
 Math.floor(Math.random()*500)+50;
},3000);

// withdraw
function withdraw(){
 if(coins<1000){alert("Minimum 1000 coins required");return;}
 alert("Withdraw request submitted ✅");
}
</script>

</body>
  </html>
