<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Gigapub SDK -->
<script src="https://ad.gigapub.tech/sdk.js"></script>

<style>
body{margin:0;font-family:sans-serif;text-align:center;transition:0.5s}
body.dark{background:#020617;color:#fff}
body.neon{background:radial-gradient(circle,#22c55e,#020617);color:#ecfeff}
body.gold{background:radial-gradient(circle,#FFD700,#B8860B);color:#0f172a}
h2{margin:10px}
.coin{font-size:20px;margin:5px}
.card{background:#020617;padding:15px;border-radius:14px;margin:10px;box-shadow:0 0 15px #22c55e55}
.btn{width:90%;padding:15px;margin:6px;border:none;border-radius:12px;font-size:16px;color:#fff;background:linear-gradient(45deg,#22c55e,#16a34a);cursor:pointer;}
.btn:disabled{background:#334155}
input,select{width:90%;padding:10px;margin:5px;border-radius:8px;border:none}
.wheel-box{position:relative;width:200px;height:200px;margin:15px auto}
.wheel{width:100%;height:100%;border-radius:50%;background:conic-gradient(#22c55e 0deg 60deg,#16a34a 60deg 120deg,#4ade80 120deg 180deg,#22c55e 180deg 240deg,#16a34a 240deg 300deg,#4ade80 300deg 360deg);border:6px solid #0f172a;transition:transform 2s ease-out}
.pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:22px;color:gold}
.spin{transform:rotate(1080deg)}
#leaderboard{list-style:none;padding:0}
#leaderboard li{background:#020617;margin:6px;padding:10px;border-radius:10px;animation:slide 0.5s ease}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.popup{display:none;position:fixed;bottom:20px;left:10%;width:80%;background:#16a34a;padding:12px;border-radius:12px;text-align:center;font-size:15px;box-shadow:0 0 15px #22c55e;animation:fade 3s ease}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
#adStatus{margin:10px;font-size:16px;font-weight:bold;color:#fff}
</style>
</head>
<body class="dark">

<h2>🎰 Lucky Spin Rewards</h2>

<div class="wheel-box">
  <div class="wheel" id="wheel"></div>
  <div class="pointer">▲</div>
</div>

<div class="coin">💰 Coins: <span id="coin">0</span></div>
<div id="value"></div>
<div id="adStatus">Ads আসেনি ❌</div>

<div class="card">
<button class="btn" onclick="playAd('reward')">🎁 Reward Ad</button>
<button class="btn" onclick="playAd('inter')">📺 Inter Ad</button>
<button class="btn" onclick="playAd('native')">📰 Native Ad</button>
</div>

<div class="card">
<h3>💳 Withdraw</h3>
<select id="method">
  <option>bKash</option>
  <option>Nagad</option>
  <option>USDT</option>
</select>
<input placeholder="Wallet / Number" id="wallet">
<button class="btn" onclick="withdraw()">Request Withdraw</button>
</div>

<div class="card">
<h3>Top Players</h3>
<ul id="leaderboard"></ul>
</div>

<div class="card">
<h3>Theme Switch</h3>
<button class="btn" onclick="toggleTheme()">🎨 Switch Theme</button>
</div>

<div class="card">
<h3>Gigapub Direct Link</h3>
<button class="btn" onclick="window.open('https://link.gigapub.tech/l/5kvfq30ta','_blank')">Open Link</button>
</div>

<div class="popup" id="popup"></div>
<div class="card">👥 Online Users: <span id="onlineCount">0</span></div>

<audio id="spinSnd" src="https://assets.mixkit.co/sfx/preview/mixkit-game-wheel-spin-1518.mp3"></audio>
<audio id="winSnd" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-bonus-229.mp3"></audio>

<script>
let coins=0,lastAdId=null,locked=false;
let theme="dark";

// Theme switch
function toggleTheme(){
  theme=theme==="dark"?"neon":theme==="neon"?"gold":"dark";
  document.body.className=theme;
}

// Wheel spin
function spinWheel(){
  const w=document.getElementById("wheel");
  w.classList.add("spin");
  document.getElementById("spinSnd").play();
  setTimeout(()=>w.classList.remove("spin"),2000);
}

// Fake leaderboard
const fakeNames=["Rafi","Hasan","Siam","Arif","Nayeem","Fahim"];
function updateLeaderboard(){
 const ul=document.getElementById("leaderboard");ul.innerHTML="";
 fakeNames.sort(()=>0.5-Math.random()).slice(0,4).forEach(n=>{
   const li=document.createElement("li");
   li.innerText=`${n} 💰 ${Math.floor(Math.random()*5000)+500}`;
   ul.appendChild(li);
 });
}
setInterval(updateLeaderboard,3500);
updateLeaderboard();

// Daily fake popup
function fakePopup(){
 const name=fakeNames[Math.floor(Math.random()*fakeNames.length)];
 const c=Math.floor(Math.random()*400)+100;
 const p=document.getElementById("popup");
 p.innerText=`🎉 ${name} won ${c} coins`;
 p.style.display="block";
 setTimeout(()=>p.style.display="none",3000);
}
setInterval(fakePopup,10000);

// Fake online users
function updateOnlineUsers(){
 document.getElementById("onlineCount").innerText=Math.floor(Math.random()*500)+50;
}
setInterval(updateOnlineUsers,3000);
updateOnlineUsers();

// Coin to money
function updateValue(){const v=coinToMoney(coins);document.getElementById("value").innerText=`≈ ${v.taka.toFixed(0)}৳ | $${v.usd.toFixed(2)}`;}
function coinToMoney(c){return {taka:(c/1000)*100,usd:(c/1200)*1};}

// Withdraw
function withdraw(){
 if(coins<1000){alert("Minimum 1000 coins required");return;}
 alert("Withdraw request saved ✅ Coins: "+coins+" | Method: "+document.getElementById("method").value);
}

// Play Ad using Gigapub SDK
function playAd(type){
 if(locked) return;
 locked=true; spinWheel();
 const adStatus=document.getElementById("adStatus");
 adStatus.innerText="Ads আসছে ⏳";

try{
  Gigapub.SDK.showAd({
    publisher_id:5619,
    ad_type:type,
    onLoaded:()=>{adStatus.innerText="Ads loaded ✅";},
    onComplete:()=>{
      adStatus.innerText="Ads শেষ ✅";
      coins+=10;
      updateValue();
      document.getElementById("winSnd").play();
      locked=false;
    },
    onError:()=>{
      adStatus.innerText="Ads load failed ❌";
      locked=false;
    }
  });
}catch(e){
  console.log("Ad error",e);
  adStatus.innerText="Ads load failed ❌";
  locked=false;
}
}
</script>
</body>
  </html>
